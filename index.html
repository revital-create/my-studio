<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #553C9A 0%, #6B46C1 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 48px 40px;
    text-align: center; max-width: 400px; width: 100%;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
  }
  .logo { font-size: 48px; margin-bottom: 12px; }
  h1 { font-size: 26px; font-weight: 800; color: #1A1A2E; margin-bottom: 6px; }
  p  { color: #718096; font-size: 14px; margin-bottom: 36px; }
  .btn {
    display: block; width: 100%; padding: 16px;
    border-radius: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; text-decoration: none; margin-bottom: 12px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
  .btn-owner {
    background: linear-gradient(135deg, #553C9A, #6B46C1);
    color: #fff; border: none;
  }
  .btn-client {
    background: #F7F5FF; color: #553C9A;
    border: 2px solid #EDE9F8;
  }
  .divider { color: #CBD5E0; font-size: 12px; margin: 8px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🧘</div>
  <h1>My Studio</h1>
  <p>ברוכ/ה הבא/ה — בחר/י את הכניסה שלך</p>
  <a href="/owner.html" class="btn btn-owner">🏠 כניסת מנהל/ת</a>
  <div class="divider">— או —</div>
  <a href="/client.html" class="btn btn-client">👤 כניסת מתאמן/ת</a>
</div>
</body>
</html>
